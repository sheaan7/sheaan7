# Regenera cada día la serpiente que se come el gráfico de contribuciones y la publica en la rama `output`.
name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#57606a&color_dots=#ebedf0,#c8d1da,#9aa7b4,#6b7a89,#3d4955
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#9fb4c7&color_dots=#161b22,#253040,#3a4a5e,#5d7189,#9fb4c7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
