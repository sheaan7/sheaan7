<svg xmlns="http://www.w3.org/2000/svg" width="900" height="12" viewBox="0 0 900 12" role="presentation">
  <style>
    .sweep { animation: sweep 7s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes sweep { from { transform: translateX(-220px); } to { transform: translateX(920px); } }
    @media (prefers-reduced-motion: reduce) { .sweep { animation: none; opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="base" x1="0" x2="1">
      <stop offset="0" stop-color="#8b949e" stop-opacity="0"/>
      <stop offset=".5" stop-color="#8b949e" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8b949e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#9fb4c7" stop-opacity="0"/>
      <stop offset=".5" stop-color="#9fb4c7"/>
      <stop offset="1" stop-color="#9fb4c7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect y="5.5" width="900" height="1" fill="url(#base)"/>
  <rect y="5" width="220" height="2" rx="1" fill="url(#shine)" class="sweep"/>
</svg>
