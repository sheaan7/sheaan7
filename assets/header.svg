<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Jean Pierre Perez — Desarrollador de software">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    /* Resting state is fully visible; "backwards" only hides elements while their entrance is pending,
       so a viewer that does not run animations still shows everything. */
    .fade { animation: fade .9s cubic-bezier(.2,.7,.2,1) backwards; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .8s; } .d3 { animation-delay: 1.6s; } .d4 { animation-delay: 2.2s; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .rule { transform-origin: 64px 0; animation: grow 1.4s cubic-bezier(.2,.7,.2,1) 1.2s backwards; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .spin  { transform-origin: 770px 137px; animation: spin 48s linear infinite; }
    .spinr { transform-origin: 770px 137px; animation: spin 72s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .glow { animation: drift 16s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(-80px); } to { transform: translateX(160px); } }
    @media (prefers-reduced-motion: reduce) {
      .fade, .rule, .cursor, .spin, .spinr, .glow { animation: none; opacity: 1; transform: none; }
    }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#e6edf3" opacity=".05"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#9fb4c7" stop-opacity=".14"/>
      <stop offset="1" stop-color="#9fb4c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#9fb4c7"/>
      <stop offset="1" stop-color="#9fb4c7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="900" height="240" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="240" fill="#0d1117"/>
    <rect width="900" height="240" fill="url(#grid)"/>
    <ellipse class="glow" cx="320" cy="70" rx="340" ry="170" fill="url(#glow)"/>
    <rect width="900" height="34" fill="#161b22"/>
    <line x1="0" y1="34.5" x2="900" y2="34.5" stroke="#30363d"/>
    <circle cx="22" cy="17" r="5" fill="#30363d"/>
    <circle cx="40" cy="17" r="5" fill="#30363d"/>
    <circle cx="58" cy="17" r="5" fill="#30363d"/>
    <text x="450" y="21" text-anchor="middle" class="mono" font-size="11" fill="#6e7681">shean@dev: ~</text>
  </g>
  <rect x=".5" y=".5" width="899" height="239" rx="13.5" fill="none" stroke="#30363d"/>

  <text x="64" y="80" class="mono fade d1" font-size="14" fill="#6e7681"><tspan fill="#9fb4c7">~</tspan> $ whoami</text>
  <text x="62" y="128" class="sans fade d2" font-size="40" font-weight="600" letter-spacing="-.5" fill="#e6edf3">Jean Pierre Perez</text>
  <rect x="64" y="145" width="140" height="2" rx="1" class="rule" fill="url(#accent)"/>
  <text x="64" y="177" class="sans fade d3" font-size="16" fill="#8b949e">Desarrollador de software  ·  Automatización  ·  IA  ·  Infraestructura</text>
  <g class="fade d4">
    <text x="64" y="213" class="mono" font-size="13" fill="#6e7681"><tspan fill="#9fb4c7">~</tspan> $</text>
    <rect x="94" y="202" width="8" height="14" fill="#9fb4c7" class="cursor"/>
  </g>

  <g class="fade d2">
    <circle cx="770" cy="137" r="88" fill="none" stroke="#9fb4c7" stroke-opacity=".18" stroke-dasharray="44 14" class="spinr"/>
    <circle cx="770" cy="137" r="74" fill="none" stroke="#9fb4c7" stroke-opacity=".55" stroke-dasharray="2 10" stroke-linecap="round" class="spin"/>
    <circle cx="770" cy="137" r="60" fill="#0d1117" stroke="#30363d"/>
    <text x="770" y="149" text-anchor="middle" class="sans" font-size="34" font-weight="300" letter-spacing="4" fill="#e6edf3">JP</text>
  </g>
</svg>
